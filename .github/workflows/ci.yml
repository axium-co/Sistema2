name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axium
          POSTGRES_PASSWORD: axium_ci_password
          POSTGRES_DB: axium_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U axium"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://axium:axium_ci_password@localhost:5432/axium_ci?schema=public
      JWT_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: local
      UPLOAD_DIR: uploads
      NEXT_PUBLIC_API_URL: http://localhost:3333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar Prisma Client e aplicar migrações
        run: |
          npm run db:generate -w @axium/api
          npm run db:deploy -w @axium/api

      - name: Lint (typecheck)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke (API compilada + CORS)
        run: npm run smoke
